name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  phpunit:
    name: Laravel PHPUnit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_sqlite, intl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: php artisan test

  ai-service:
    name: AI service unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install and test classify
        working-directory: docker/ai-service
        run: |
          pip install --no-cache-dir -r requirements.txt
          python test_classify.py

  frontend:
    name: Next.js build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_PUBLIC_BASE_PATH: /app

  trivy:
    name: Trivy (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: rms-api:ci
            dockerfile: docker/api/Dockerfile
            build: true
          - name: ai-service
            image: rms-ai-service:ci
            dockerfile: docker/ai-service/Dockerfile
            build: true
          - name: frontend
            image: rms-frontend:ci
            dockerfile: docker/frontend/Dockerfile
            build: true
          - name: nginx
            image: nginx:1.27-alpine
            dockerfile: ""
            build: false
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        if: matrix.build

      - name: Build image
        if: matrix.build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.image }}
          cache-from: type=gha,scope=trivy-${{ matrix.name }}
          cache-to: type=gha,mode=min,scope=trivy-${{ matrix.name }}

      - name: Pull public image
        if: ${{ !matrix.build }}
        run: docker pull ${{ matrix.image }}

      - name: Trivy report (CRITICAL,HIGH)
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Trivy SARIF
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

      - name: Trivy gate (CRITICAL)
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
