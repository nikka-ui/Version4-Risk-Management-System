# AI Risk Management System - base compose stack
# Usage (dev):  docker compose -f docker/compose.yml -f docker/compose.override.yml up
# Usage (prod): docker compose -f docker/compose.yml -f docker/compose.prod.yml up -d

name: rms

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: rms-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/edge-ui:/etc/nginx/edge-ui:ro
    networks:
      - rms_edge
      - rms_app
    depends_on:
      api:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ../
      dockerfile: docker/api/Dockerfile
    container_name: rms-api
    restart: unless-stopped
    environment:
      APP_NAME: RMS API
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_KEY_FILE: /run/secrets/app_key
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-rms}
      DB_USERNAME: ${DB_USERNAME:-rms}
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_CLIENT: phpredis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: file
      SESSION_COOKIE: rms_session
      SESSION_SECURE_COOKIE: "false"
      SESSION_SAME_SITE: lax
      SESSION_DOMAIN: ""
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:8080,127.0.0.1:8080}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:5000}
      # Path for import (+ optional dual-write if flags re-enabled).
      STORE_JSON_PATH: ${STORE_JSON_PATH:-/import/store.json}
      RMS_INTERNAL_SERVICE_TOKEN: ${RMS_INTERNAL_SERVICE_TOKEN:-rms-dev-internal}
      # Phase 6 slice 1: Laravel `/` redirects to Blade login / role console when true.
      USE_LARAVEL_EDGE_ROOT: ${USE_LARAVEL_EDGE_ROOT:-true}
      # Phase 6 slice 2: unprefixed Blade URLs (/login, /admin, …) when true.
      USE_LARAVEL_EDGE_UI: ${USE_LARAVEL_EDGE_UI:-true}
      # Phase 10 slice 3: store.json dual-write OFF by default (Postgres sole SoT).
      USE_LARAVEL_INTERNAL_TICKETS: ${USE_LARAVEL_INTERNAL_TICKETS:-false}
      USE_LARAVEL_INTERNAL_ORG: ${USE_LARAVEL_INTERNAL_ORG:-false}
      # Phase 3 slice 10: shared MinIO bucket for the `evidence` filesystem disk.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-rms-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rmsminio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rmsminio-dev-change-me}
      S3_USE_PATH_STYLE_ENDPOINT: ${S3_USE_PATH_STYLE_ENDPOINT:-true}
    secrets:
      - db_password
      - app_key
    volumes:
      # store.json import source (dual-write optional via USE_LARAVEL_INTERNAL_*).
      - ./data/store.json:/import/store.json
    networks:
      - rms_app
      - rms_data
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  ai-service:
    build:
      context: ../
      dockerfile: docker/ai-service/Dockerfile
    container_name: rms-ai-service
    restart: unless-stopped
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-rms}
      DB_USERNAME: ${DB_USERNAME:-rms}
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    networks:
      - rms_app
      - rms_data
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    container_name: rms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-rms}
      POSTGRES_USER: ${DB_USERNAME:-rms}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - rms_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - rms_data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-rms} -d ${DB_DATABASE:-rms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    container_name: rms-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - rms_redis_data:/data
    networks:
      - rms_data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio:latest
    container_name: rms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rmsminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rmsminio-dev-change-me}
    volumes:
      - rms_minio_data:/data
    networks:
      - rms_data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  minio-init:
    image: minio/mc:latest
    container_name: rms-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rmsminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rmsminio-dev-change-me}
      S3_BUCKET: ${S3_BUCKET:-rms-uploads}
    entrypoint: >
      /bin/sh -c "
      mc alias set rms http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing rms/$$S3_BUCKET &&
      exit 0
      "
    networks:
      - rms_data

networks:
  rms_edge:
    name: rms_edge
    driver: bridge
  rms_app:
    name: rms_app
    driver: bridge
    internal: false
  rms_data:
    name: rms_data
    driver: bridge
    internal: true

volumes:
  rms_postgres_data:
    name: rms_postgres_data
  rms_redis_data:
    name: rms_redis_data
  rms_minio_data:
    name: rms_minio_data

secrets:
  db_password:
    file: ./secrets/db_password.txt
  app_key:
    file: ./secrets/app_key.txt
