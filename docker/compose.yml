# AI Risk Management System - base compose stack
# Usage (dev):  docker compose -f docker/compose.yml -f docker/compose.override.yml up
# Usage (prod): docker compose -f docker/compose.yml -f docker/compose.prod.yml up -d

name: rms

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: rms-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/edge-ui:/etc/nginx/edge-ui:ro
    networks:
      - rms_edge
      - rms_app
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ../
      dockerfile: docker/web/Dockerfile
    container_name: rms-web
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3000"
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-rms}
      DB_USERNAME: ${DB_USERNAME:-rms}
      DB_PASSWORD_FILE: /run/secrets/db_password
      FILE_STORAGE_DRIVER: ${FILE_STORAGE_DRIVER:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-rms-uploads}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rmsminio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rmsminio-dev-change-me}
      S3_USE_PATH_STYLE_ENDPOINT: ${S3_USE_PATH_STYLE_ENDPOINT:-true}
      # Phase 5 slice 1: dual-write + attachment bridge ON by default.
      USE_LARAVEL_API: ${USE_LARAVEL_API:-true}
      RMS_INTERNAL_SERVICE_TOKEN: ${RMS_INTERNAL_SERVICE_TOKEN:-rms-dev-internal}
      # Phase 5 slice 3: Laravel credential verify for browser login ON by default.
      USE_LARAVEL_AUTH: ${USE_LARAVEL_AUTH:-true}
      USE_LARAVEL_AUTH_FALLBACK: ${USE_LARAVEL_AUTH_FALLBACK:-false}
      # Phase 5 slice 4: Blade login UI at /laravel/login (Express cookie via /auth/bridge).
      USE_LARAVEL_LOGIN_UI: ${USE_LARAVEL_LOGIN_UI:-true}
      # Phase 5 slice 5: Blade admin profile at /laravel/admin/profile.
      USE_LARAVEL_PROFILE_UI: ${USE_LARAVEL_PROFILE_UI:-true}
      # Phase 5 slice 6: Blade Ticket Reporter profile at /laravel/supervisor/profile.
      USE_LARAVEL_REPORTER_PROFILE_UI: ${USE_LARAVEL_REPORTER_PROFILE_UI:-true}
      # Phase 5 slice 7: Blade Ticket Reporter dashboard at /laravel/supervisor.
      USE_LARAVEL_REPORTER_DASHBOARD_UI: ${USE_LARAVEL_REPORTER_DASHBOARD_UI:-true}
      # Phase 5 slice 8: Blade Ticket Reporter ticket lists.
      USE_LARAVEL_REPORTER_TICKETS_UI: ${USE_LARAVEL_REPORTER_TICKETS_UI:-true}
      # Phase 5 slice 9: Blade Ticket Reporter ticket detail.
      USE_LARAVEL_REPORTER_TICKET_DETAIL_UI: ${USE_LARAVEL_REPORTER_TICKET_DETAIL_UI:-true}
      # Phase 5 slice 10: Blade Ticket Reporter notifications.
      USE_LARAVEL_REPORTER_NOTIFICATIONS_UI: ${USE_LARAVEL_REPORTER_NOTIFICATIONS_UI:-true}
      # Phase 5 slice 11: Blade Ticket Reporter accomplishments.
      USE_LARAVEL_REPORTER_ACCOMPLISHMENTS_UI: ${USE_LARAVEL_REPORTER_ACCOMPLISHMENTS_UI:-true}
      # Phase 5 slice 12: Blade Ticket Reporter actions queue.
      USE_LARAVEL_REPORTER_ACTIONS_UI: ${USE_LARAVEL_REPORTER_ACTIONS_UI:-true}
      USE_LARAVEL_REPORTER_TICKET_FORM_UI: ${USE_LARAVEL_REPORTER_TICKET_FORM_UI:-true}
      # Phase 7 slice 7 + Phase 8 slice 5: Blade reporter preview save/submit + draft delete + comment edit/react POSTs.
      USE_LARAVEL_REPORTER_TICKET_MUTATIONS: ${USE_LARAVEL_REPORTER_TICKET_MUTATIONS:-true}
      # Phase 8 slice 1–2: Blade reporter create/edit + evidence + accomplishment uploads.
      USE_LARAVEL_REPORTER_UPLOAD_MUTATIONS: ${USE_LARAVEL_REPORTER_UPLOAD_MUTATIONS:-true}
      # Phase 5 slice 14: Blade admin dashboard at /laravel/admin.
      USE_LARAVEL_ADMIN_DASHBOARD_UI: ${USE_LARAVEL_ADMIN_DASHBOARD_UI:-true}
      # Phase 5 slice 15: Blade admin user management at /laravel/admin/users.
      USE_LARAVEL_ADMIN_USERS_UI: ${USE_LARAVEL_ADMIN_USERS_UI:-true}
      # Phase 7 slice 3: Blade admin user create/edit/status/reset/delete POSTs.
      USE_LARAVEL_ADMIN_USER_MUTATIONS: ${USE_LARAVEL_ADMIN_USER_MUTATIONS:-true}
      # Phase 5 slice 16: Blade admin departments at /laravel/admin/departments.
      USE_LARAVEL_ADMIN_DEPARTMENTS_UI: ${USE_LARAVEL_ADMIN_DEPARTMENTS_UI:-true}
      # Phase 7 slice 1: Blade admin department create/edit/delete POSTs.
      USE_LARAVEL_ADMIN_DEPT_MUTATIONS: ${USE_LARAVEL_ADMIN_DEPT_MUTATIONS:-true}
      # Phase 5 slice 17: Blade admin positions at /laravel/admin/positions.
      USE_LARAVEL_ADMIN_POSITIONS_UI: ${USE_LARAVEL_ADMIN_POSITIONS_UI:-true}
      # Phase 7 slice 2: Blade admin position create/edit/delete POSTs.
      USE_LARAVEL_ADMIN_POS_MUTATIONS: ${USE_LARAVEL_ADMIN_POS_MUTATIONS:-true}
      # Phase 5 slice 18: Blade admin tickets at /laravel/admin/tickets.
      USE_LARAVEL_ADMIN_TICKETS_UI: ${USE_LARAVEL_ADMIN_TICKETS_UI:-true}
      # Phase 5 slice 19: Blade admin ticket detail at /laravel/admin/tickets/:ref.
      USE_LARAVEL_ADMIN_TICKET_DETAIL_UI: ${USE_LARAVEL_ADMIN_TICKET_DETAIL_UI:-true}
      # Phase 7 slice 5: Blade admin ticket soft-delete POST.
      USE_LARAVEL_ADMIN_TICKET_MUTATIONS: ${USE_LARAVEL_ADMIN_TICKET_MUTATIONS:-true}
      # Phase 5 slice 20: Blade admin audit logs at /laravel/admin/audit-logs.
      USE_LARAVEL_ADMIN_AUDIT_LOGS_UI: ${USE_LARAVEL_ADMIN_AUDIT_LOGS_UI:-true}
      # Phase 5 slice 21: Blade admin system settings at /laravel/admin/settings.
      USE_LARAVEL_ADMIN_SETTINGS_UI: ${USE_LARAVEL_ADMIN_SETTINGS_UI:-true}
      # Phase 7 slice 4: Blade admin settings save/reset POSTs.
      USE_LARAVEL_ADMIN_SETTINGS_MUTATIONS: ${USE_LARAVEL_ADMIN_SETTINGS_MUTATIONS:-true}
      # Phase 5 slice 22: Blade dept dashboard at /laravel/dept.
      USE_LARAVEL_DEPT_DASHBOARD_UI: ${USE_LARAVEL_DEPT_DASHBOARD_UI:-true}
      # Phase 5 slice 23: Blade dept queues at /laravel/dept/*.
      USE_LARAVEL_DEPT_QUEUES_UI: ${USE_LARAVEL_DEPT_QUEUES_UI:-true}
      # Phase 5 slice 24: Blade dept ticket detail at /laravel/dept/tickets/:ref.
      USE_LARAVEL_DEPT_TICKET_DETAIL_UI: ${USE_LARAVEL_DEPT_TICKET_DETAIL_UI:-true}
      # Phase 7 slice 6 + slice 13 + Phase 8 slice 3–5: Blade dept workflow + comment + document + personnel/resolution + comment edit/react POSTs.
      USE_LARAVEL_DEPT_TICKET_MUTATIONS: ${USE_LARAVEL_DEPT_TICKET_MUTATIONS:-true}
      # Phase 5 slice 25: Blade officer dashboard at /laravel/officer.
      USE_LARAVEL_OFFICER_DASHBOARD_UI: ${USE_LARAVEL_OFFICER_DASHBOARD_UI:-true}
      # Phase 5 slice 26: Blade officer queues at /laravel/officer/*.
      USE_LARAVEL_OFFICER_QUEUES_UI: ${USE_LARAVEL_OFFICER_QUEUES_UI:-true}
      # Phase 5 slice 27: Blade officer ticket detail at /laravel/officer/tickets/:ref.
      USE_LARAVEL_OFFICER_TICKET_DETAIL_UI: ${USE_LARAVEL_OFFICER_TICKET_DETAIL_UI:-true}
      # Phase 7 slice 8 + slice 11: Blade officer reopen + thread-comment POSTs.
      USE_LARAVEL_OFFICER_TICKET_MUTATIONS: ${USE_LARAVEL_OFFICER_TICKET_MUTATIONS:-true}
      # Phase 6 slice 5: Blade RMO legacy aliases /officer/{ai-review,review,final-validation}.
      USE_LARAVEL_OFFICER_ALIASES_UI: ${USE_LARAVEL_OFFICER_ALIASES_UI:-true}
      # Phase 6 slice 6: Blade employee /dashboard stub.
      USE_LARAVEL_DASHBOARD_UI: ${USE_LARAVEL_DASHBOARD_UI:-true}
      # Phase 5 slice 28: Blade Executive Committee dashboard at /laravel/executive.
      USE_LARAVEL_EXECUTIVE_DASHBOARD_UI: ${USE_LARAVEL_EXECUTIVE_DASHBOARD_UI:-true}
      # Phase 6 slice 3: Blade Executive oversight pages at /laravel/executive/*.
      USE_LARAVEL_EXECUTIVE_PAGES_UI: ${USE_LARAVEL_EXECUTIVE_PAGES_UI:-true}
      # Phase 6 slice 4: Blade Executive ticket detail at /laravel/executive/tickets/:ref.
      USE_LARAVEL_EXECUTIVE_TICKET_DETAIL_UI: ${USE_LARAVEL_EXECUTIVE_TICKET_DETAIL_UI:-true}
      # Phase 7 slice 10: Blade executive comment POST.
      USE_LARAVEL_EXECUTIVE_TICKET_MUTATIONS: ${USE_LARAVEL_EXECUTIVE_TICKET_MUTATIONS:-true}
      # Phase 5 slice 29: Blade President dashboard at /laravel/president.
      USE_LARAVEL_PRESIDENT_DASHBOARD_UI: ${USE_LARAVEL_PRESIDENT_DASHBOARD_UI:-true}
      # Phase 5 slice 31: Blade President ticket detail at /laravel/president/tickets/:ref.
      USE_LARAVEL_PRESIDENT_TICKET_DETAIL_UI: ${USE_LARAVEL_PRESIDENT_TICKET_DETAIL_UI:-true}
      # Phase 7 slice 9 + slice 12: Blade president decision + comment POSTs.
      USE_LARAVEL_PRESIDENT_TICKET_MUTATIONS: ${USE_LARAVEL_PRESIDENT_TICKET_MUTATIONS:-true}
      # Phase 5 slice 30: Blade President queues at /laravel/president/*.
      USE_LARAVEL_PRESIDENT_QUEUES_UI: ${USE_LARAVEL_PRESIDENT_QUEUES_UI:-true}
      # Phase 6 slice 1: edge nginx exact `/` → Laravel (observability on web health).
      USE_LARAVEL_EDGE_ROOT: ${USE_LARAVEL_EDGE_ROOT:-true}
      # Phase 6 slice 2: unprefixed Blade GETs /login + role consoles.
      USE_LARAVEL_EDGE_UI: ${USE_LARAVEL_EDGE_UI:-true}
      LARAVEL_API_BASE_URL: ${LARAVEL_API_BASE_URL:-http://api:8080}
    secrets:
      - db_password
    volumes:
      - ./web/data:/app/data
    networks:
      - rms_app
      - rms_data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      # Use /health — GET / redirects to /laravel/login when USE_LARAVEL_LOGIN_UI is on.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ../
      dockerfile: docker/api/Dockerfile
    container_name: rms-api
    restart: unless-stopped
    environment:
      APP_NAME: RMS API
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_KEY_FILE: /run/secrets/app_key
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-rms}
      DB_USERNAME: ${DB_USERNAME:-rms}
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_CLIENT: phpredis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: file
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:8080,127.0.0.1:8080}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:5000}
      # Phase 1: path for `php artisan rms:import-users` (Express store remains SoT for live auth)
      STORE_JSON_PATH: ${STORE_JSON_PATH:-/import/store.json}
      # Phase 7 slice 1: Laravel → Express org mirror (empty disables mirror).
      RMS_INTERNAL_SERVICE_TOKEN: ${RMS_INTERNAL_SERVICE_TOKEN:-rms-dev-internal}
      EXPRESS_WEB_INTERNAL_URL: ${EXPRESS_WEB_INTERNAL_URL:-http://web:3000}
      # Phase 6 slice 1: Laravel `/` redirects to Blade login / role console when true.
      USE_LARAVEL_EDGE_ROOT: ${USE_LARAVEL_EDGE_ROOT:-true}
      # Phase 6 slice 2: unprefixed Blade URLs (/login, /admin, …) when true.
      USE_LARAVEL_EDGE_UI: ${USE_LARAVEL_EDGE_UI:-true}
      # Phase 9 slice 5–6: Laravel writes ticket/org dual-write to store.json.
      USE_LARAVEL_INTERNAL_TICKETS: ${USE_LARAVEL_INTERNAL_TICKETS:-true}
      USE_LARAVEL_INTERNAL_ORG: ${USE_LARAVEL_INTERNAL_ORG:-true}
      # Phase 3 slice 10: shared MinIO bucket (same S3_* names + values as web) for the
      # `evidence` filesystem disk. Express stays the live upload/download path (flag OFF).
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-rms-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rmsminio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rmsminio-dev-change-me}
      S3_USE_PATH_STYLE_ENDPOINT: ${S3_USE_PATH_STYLE_ENDPOINT:-true}
    secrets:
      - db_password
      - app_key
    volumes:
      # Express store.json — Laravel ticket/org mirrors write this path (Phase 9 slice 5–6).
      - ./web/data/store.json:/import/store.json
    networks:
      - rms_app
      - rms_data
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  ai-service:
    build:
      context: ../
      dockerfile: docker/ai-service/Dockerfile
    container_name: rms-ai-service
    restart: unless-stopped
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-rms}
      DB_USERNAME: ${DB_USERNAME:-rms}
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    networks:
      - rms_app
      - rms_data
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    container_name: rms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-rms}
      POSTGRES_USER: ${DB_USERNAME:-rms}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - rms_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - rms_data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-rms} -d ${DB_DATABASE:-rms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    container_name: rms-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - rms_redis_data:/data
    networks:
      - rms_data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio:latest
    container_name: rms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rmsminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rmsminio-dev-change-me}
    volumes:
      - rms_minio_data:/data
    networks:
      - rms_data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  minio-init:
    image: minio/mc:latest
    container_name: rms-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rmsminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rmsminio-dev-change-me}
      S3_BUCKET: ${S3_BUCKET:-rms-uploads}
    entrypoint: >
      /bin/sh -c "
      mc alias set rms http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing rms/$$S3_BUCKET &&
      exit 0
      "
    networks:
      - rms_data

networks:
  rms_edge:
    name: rms_edge
    driver: bridge
  rms_app:
    name: rms_app
    driver: bridge
    internal: false
  rms_data:
    name: rms_data
    driver: bridge
    internal: true

volumes:
  rms_postgres_data:
    name: rms_postgres_data
  rms_redis_data:
    name: rms_redis_data
  rms_web_data:
    name: rms_web_data
  rms_minio_data:
    name: rms_minio_data

secrets:
  db_password:
    file: ./secrets/db_password.txt
  app_key:
    file: ./secrets/app_key.txt
