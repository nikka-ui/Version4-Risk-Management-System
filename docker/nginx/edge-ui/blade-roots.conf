# Phase 6 slice 2 + Phase 7–9: Blade UI + dual-write internals on Laravel.
# GET/HEAD/POST listed below → Laravel api:8080. Express `web` is removed.
# /laravel/* rewrite remains for bookmarks. Soak omits this file.

# Phase 9 slice 1: Blade stylesheets and images (no Express).
location ^~ /css/ {
    set $upstream_api api;
    proxy_pass http://$upstream_api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
}

location ^~ /img/ {
    set $upstream_api api;
    proxy_pass http://$upstream_api:8080;
