# Phase 6 slice 2 + Phase 7 slice 1–13 + Phase 8 slice 1–3: unprefixed /login, role consoles, admin + dept + reporter + officer + president + executive comment + reporter/dept uploads.
# GET/HEAD → Laravel api:8080; other POSTs → Express web:3000 unless listed below.
# /laravel/* rewrite remains for bookmarks. Soak omits this file.

# Login GET + POST stay on Laravel (Blade form + web session).
location = /login {
    set $upstream_api api;
    proxy_pass http://$upstream_api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
}

