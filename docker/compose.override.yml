# Development overrides - hot reload friendly, optional local tools
# docker compose -f docker/compose.yml -f docker/compose.override.yml --profile dev up

services:
  nginx:
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    depends_on:
      frontend:
        condition: service_healthy
        required: false

  api:
    environment:
      APP_ENV: local
      STORE_JSON_PATH: /import/store.json
      USE_LARAVEL_EDGE_ROOT: ${USE_LARAVEL_EDGE_ROOT:-true}
      USE_LARAVEL_EDGE_UI: ${USE_LARAVEL_EDGE_UI:-true}
      USE_LARAVEL_INTERNAL_TICKETS: ${USE_LARAVEL_INTERNAL_TICKETS:-false}
      USE_LARAVEL_INTERNAL_ORG: ${USE_LARAVEL_INTERNAL_ORG:-false}
      RMS_INTERNAL_SERVICE_TOKEN: ${RMS_INTERNAL_SERVICE_TOKEN:-rms-dev-internal}
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: noreply@rms.local
      MAIL_FROM_NAME: ACCC RMS
    volumes:
      - ./data/store.json:/import/store.json

  ai-service:
    environment:
      FLASK_ENV: development
    ports:
      - "127.0.0.1:${AI_DEBUG_PORT:-5001}:5000"

  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

  minio:
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: rms-mailpit
    networks:
      - rms_app
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ../
      dockerfile: docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/app}
    container_name: rms-frontend
    profiles:
      - frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/app}
      NEXT_PUBLIC_BLADE_URL: ${NEXT_PUBLIC_BLADE_URL:-http://localhost:8080/login}
    networks:
      - rms_app
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/app/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
