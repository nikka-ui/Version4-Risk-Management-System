# Development overrides - hot reload friendly, optional local tools
# docker compose -f docker/compose.yml -f docker/compose.override.yml --profile dev up

services:
  nginx:
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"

  web:
    # Dev-only: run as root so the app can write to the bind-mounted
    # ./web/data directory on Windows/WSL hosts. Production keeps USER node.
    user: root
    environment:
      NODE_ENV: development
      USE_LARAVEL_API: ${USE_LARAVEL_API:-true}
      USE_LARAVEL_AUTH: ${USE_LARAVEL_AUTH:-true}
      USE_LARAVEL_AUTH_FALLBACK: ${USE_LARAVEL_AUTH_FALLBACK:-false}
      USE_LARAVEL_LOGIN_UI: ${USE_LARAVEL_LOGIN_UI:-true}
      USE_LARAVEL_PROFILE_UI: ${USE_LARAVEL_PROFILE_UI:-true}
      USE_LARAVEL_REPORTER_PROFILE_UI: ${USE_LARAVEL_REPORTER_PROFILE_UI:-true}
      USE_LARAVEL_REPORTER_DASHBOARD_UI: ${USE_LARAVEL_REPORTER_DASHBOARD_UI:-true}
      USE_LARAVEL_REPORTER_TICKETS_UI: ${USE_LARAVEL_REPORTER_TICKETS_UI:-true}
      USE_LARAVEL_REPORTER_TICKET_DETAIL_UI: ${USE_LARAVEL_REPORTER_TICKET_DETAIL_UI:-true}
      USE_LARAVEL_REPORTER_NOTIFICATIONS_UI: ${USE_LARAVEL_REPORTER_NOTIFICATIONS_UI:-true}
      USE_LARAVEL_REPORTER_ACCOMPLISHMENTS_UI: ${USE_LARAVEL_REPORTER_ACCOMPLISHMENTS_UI:-true}
      USE_LARAVEL_REPORTER_ACTIONS_UI: ${USE_LARAVEL_REPORTER_ACTIONS_UI:-true}
      USE_LARAVEL_REPORTER_TICKET_FORM_UI: ${USE_LARAVEL_REPORTER_TICKET_FORM_UI:-true}
      USE_LARAVEL_REPORTER_TICKET_MUTATIONS: ${USE_LARAVEL_REPORTER_TICKET_MUTATIONS:-true}
      USE_LARAVEL_REPORTER_UPLOAD_MUTATIONS: ${USE_LARAVEL_REPORTER_UPLOAD_MUTATIONS:-true}
      USE_LARAVEL_ADMIN_DASHBOARD_UI: ${USE_LARAVEL_ADMIN_DASHBOARD_UI:-true}
      USE_LARAVEL_ADMIN_USERS_UI: ${USE_LARAVEL_ADMIN_USERS_UI:-true}
      USE_LARAVEL_ADMIN_USER_MUTATIONS: ${USE_LARAVEL_ADMIN_USER_MUTATIONS:-true}
      USE_LARAVEL_ADMIN_DEPARTMENTS_UI: ${USE_LARAVEL_ADMIN_DEPARTMENTS_UI:-true}
      USE_LARAVEL_ADMIN_DEPT_MUTATIONS: ${USE_LARAVEL_ADMIN_DEPT_MUTATIONS:-true}
      RMS_INTERNAL_SERVICE_TOKEN: ${RMS_INTERNAL_SERVICE_TOKEN:-rms-dev-internal}
      USE_LARAVEL_ADMIN_POSITIONS_UI: ${USE_LARAVEL_ADMIN_POSITIONS_UI:-true}
      USE_LARAVEL_ADMIN_POS_MUTATIONS: ${USE_LARAVEL_ADMIN_POS_MUTATIONS:-true}
      USE_LARAVEL_ADMIN_TICKETS_UI: ${USE_LARAVEL_ADMIN_TICKETS_UI:-true}
      USE_LARAVEL_ADMIN_TICKET_DETAIL_UI: ${USE_LARAVEL_ADMIN_TICKET_DETAIL_UI:-true}
      USE_LARAVEL_ADMIN_TICKET_MUTATIONS: ${USE_LARAVEL_ADMIN_TICKET_MUTATIONS:-true}
      USE_LARAVEL_ADMIN_AUDIT_LOGS_UI: ${USE_LARAVEL_ADMIN_AUDIT_LOGS_UI:-true}
      USE_LARAVEL_ADMIN_SETTINGS_UI: ${USE_LARAVEL_ADMIN_SETTINGS_UI:-true}
      USE_LARAVEL_ADMIN_SETTINGS_MUTATIONS: ${USE_LARAVEL_ADMIN_SETTINGS_MUTATIONS:-true}
      USE_LARAVEL_DEPT_DASHBOARD_UI: ${USE_LARAVEL_DEPT_DASHBOARD_UI:-true}
      USE_LARAVEL_DEPT_QUEUES_UI: ${USE_LARAVEL_DEPT_QUEUES_UI:-true}
      USE_LARAVEL_DEPT_TICKET_DETAIL_UI: ${USE_LARAVEL_DEPT_TICKET_DETAIL_UI:-true}
      USE_LARAVEL_DEPT_TICKET_MUTATIONS: ${USE_LARAVEL_DEPT_TICKET_MUTATIONS:-true}
      USE_LARAVEL_OFFICER_DASHBOARD_UI: ${USE_LARAVEL_OFFICER_DASHBOARD_UI:-true}
      USE_LARAVEL_OFFICER_QUEUES_UI: ${USE_LARAVEL_OFFICER_QUEUES_UI:-true}
      USE_LARAVEL_OFFICER_TICKET_DETAIL_UI: ${USE_LARAVEL_OFFICER_TICKET_DETAIL_UI:-true}
      USE_LARAVEL_OFFICER_TICKET_MUTATIONS: ${USE_LARAVEL_OFFICER_TICKET_MUTATIONS:-true}
      USE_LARAVEL_OFFICER_ALIASES_UI: ${USE_LARAVEL_OFFICER_ALIASES_UI:-true}
      USE_LARAVEL_DASHBOARD_UI: ${USE_LARAVEL_DASHBOARD_UI:-true}
      USE_LARAVEL_EXECUTIVE_DASHBOARD_UI: ${USE_LARAVEL_EXECUTIVE_DASHBOARD_UI:-true}
      USE_LARAVEL_EXECUTIVE_PAGES_UI: ${USE_LARAVEL_EXECUTIVE_PAGES_UI:-true}
      USE_LARAVEL_EXECUTIVE_TICKET_DETAIL_UI: ${USE_LARAVEL_EXECUTIVE_TICKET_DETAIL_UI:-true}
      USE_LARAVEL_EXECUTIVE_TICKET_MUTATIONS: ${USE_LARAVEL_EXECUTIVE_TICKET_MUTATIONS:-true}
      USE_LARAVEL_PRESIDENT_DASHBOARD_UI: ${USE_LARAVEL_PRESIDENT_DASHBOARD_UI:-true}
      USE_LARAVEL_PRESIDENT_QUEUES_UI: ${USE_LARAVEL_PRESIDENT_QUEUES_UI:-true}
      USE_LARAVEL_PRESIDENT_TICKET_DETAIL_UI: ${USE_LARAVEL_PRESIDENT_TICKET_DETAIL_UI:-true}
      USE_LARAVEL_PRESIDENT_TICKET_MUTATIONS: ${USE_LARAVEL_PRESIDENT_TICKET_MUTATIONS:-true}
      USE_LARAVEL_EDGE_ROOT: ${USE_LARAVEL_EDGE_ROOT:-true}
      USE_LARAVEL_EDGE_UI: ${USE_LARAVEL_EDGE_UI:-true}
      LARAVEL_API_BASE_URL: http://api:8080
    volumes:
      - ./web/data:/app/data
      # Mount app source so role consoles update without image rebuild
      - ./web/server.js:/app/server.js
      - ./web/lib:/app/lib
      - ./web/config:/app/config
      - ./web/public:/app/public

  api:
    environment:
      APP_ENV: local
      STORE_JSON_PATH: /import/store.json
      USE_LARAVEL_EDGE_ROOT: ${USE_LARAVEL_EDGE_ROOT:-true}
      USE_LARAVEL_EDGE_UI: ${USE_LARAVEL_EDGE_UI:-true}
      RMS_INTERNAL_SERVICE_TOKEN: ${RMS_INTERNAL_SERVICE_TOKEN:-rms-dev-internal}
      EXPRESS_WEB_INTERNAL_URL: ${EXPRESS_WEB_INTERNAL_URL:-http://web:3000}
    volumes:
      # Ensure import path is available in dev even if base compose is overridden.
      - ./web/data/store.json:/import/store.json:ro

  ai-service:
    environment:
      FLASK_ENV: development
    ports:
      - "127.0.0.1:${AI_DEBUG_PORT:-5001}:5000"

  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

  minio:
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: rms-mailpit
    profiles:
      - dev
    networks:
      - rms_app
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  rms_minio_data:
    name: rms_minio_data
